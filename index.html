<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LectureVault</title>
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js" type="module"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/docx@8/build/index.umd.js"></script>
<style>
:root{
  --bg:#1A1D20;--bg2:#22262A;--bg3:#2A2F34;--text:#D4D4D4;--t2:#8B8F94;--t3:#5A5E63;
  --accent:#6DB58A;--ad:rgba(109,181,138,0.15);--warn:#F59E0B;--wd:rgba(245,158,11,0.15);
  --danger:#EF4444;--info:#60A5FA;--id:rgba(96,165,250,0.12);--p:#C084FC;
  --brd:rgba(255,255,255,0.06);--r:12px;--rs:8px;
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
.light{
  --bg:#FAFAF8;--bg2:#FFF;--bg3:#F3F3F0;--text:#2D2D2D;--t2:#6B6B6B;--t3:#A0A0A0;
  --accent:#7D9B76;--ad:rgba(125,155,118,0.1);--warn:#D97706;--wd:rgba(217,119,6,0.1);
  --danger:#DC2626;--info:#3B82F6;--id:rgba(59,130,246,0.1);--brd:rgba(0,0,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--ff);background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s,color .4s;}
.app{display:flex;height:100vh;overflow:hidden;}

/* Sidebar */
.sb{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;padding:16px 10px;z-index:10;}
.lg{font-size:1.05em;font-weight:700;color:var(--accent);padding:8px 12px;margin-bottom:16px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.lg .d{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);}
.si{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--rs);color:var(--t2);font-size:.85em;cursor:pointer;transition:all .2s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:var(--ff);}
.si:hover{background:var(--bg3);color:var(--text);}
.si.ac{background:var(--ad);color:var(--accent);font-weight:600;}
.si .ic{font-size:1.15em;width:22px;text-align:center;}
.sb-badge{margin-left:auto;font-size:.68em;background:var(--ad);color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:600;}
.divider{height:1px;background:var(--brd);margin:10px 0;}
.cm{flex:1;overflow-y:auto;}
.ci{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--rs);cursor:pointer;font-size:.8em;color:var(--t2);transition:all .2s;}
.ci:hover{background:var(--bg3);}
.ci .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.tb{padding:10px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--brd);background:var(--bg2);}
.bc{font-size:.82em;color:var(--t2);}
.sbox{margin-left:auto;background:var(--bg);border:1px solid var(--brd);border-radius:18px;padding:6px 12px;width:220px;display:flex;align-items:center;gap:6px;position:relative;}
.sbox input{border:none;background:transparent;color:var(--text);font-size:.8em;outline:none;width:100%;font-family:var(--ff);}
.sbox:focus-within{border-color:var(--accent);}
.sbox kbd{font-size:.7em;background:var(--bg3);padding:1px 5px;border-radius:4px;border:1px solid var(--brd);}
.thm{width:32px;height:32px;border-radius:50%;border:1px solid var(--brd);background:var(--bg);cursor:pointer;font-size:1em;}
.ct{flex:1;overflow-y:auto;padding:20px 24px;}
.page{display:none;animation:fi .35s ease;}
.page.ac{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:1.5em;font-weight:700;margin-bottom:4px;}
.sub{color:var(--t2);font-size:.88em;margin-bottom:20px;}

/* Buttons */
.btn{padding:10px 18px;border-radius:var(--rs);border:none;cursor:pointer;font-size:.85em;font-weight:600;transition:all .2s;font-family:var(--ff);}
.btn-p{background:var(--accent);color:#fff;}
.btn-p:hover{box-shadow:0 0 18px var(--ad);transform:translateY(-1px);}
.btn-o{background:transparent;border:1px solid var(--brd);color:var(--t2);}
.btn-o:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:5px 12px;font-size:.75em;}
.btn-d{background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:.75em;}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:18px;margin-bottom:10px;transition:all .2s;}
.card:hover{border-color:var(--accent);cursor:pointer;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:18px;}
.kpi .l{font-size:.75em;color:var(--t2);margin-bottom:4px;}
.kpi .v{font-size:1.8em;font-weight:800;}
.kpi .s{font-size:.72em;color:var(--t3);margin-top:2px;}
.g{color:var(--accent);}.b{color:var(--info);}.a{color:var(--warn);}

.progress{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:8px;}
.pfill{height:100%;border-radius:2px;transition:width 1s ease;}
.cg{background:var(--accent);}.cb{background:var(--info);}.ca{background:var(--warn);}.cp{background:var(--p);}
.wt{font-size:.7em;color:var(--warn);background:var(--wd);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:6px;}
.tag{font-size:.7em;padding:3px 8px;border-radius:6px;}

/* Empty */
.emp{text-align:center;padding:60px 20px;color:var(--t3);}
.emp .ic{font-size:3.5em;margin-bottom:12px;}
.emp h2{color:var(--t2);margin-bottom:6px;font-size:1.15em;}

/* Upload */
.up{border:2px dashed var(--brd);border-radius:var(--r);padding:40px;text-align:center;cursor:pointer;transition:all .3s;margin-bottom:14px;}
.up:hover,.up.drag{border-color:var(--accent);background:var(--ad);}
.up .ic{font-size:2.5em;margin-bottom:6px;}
.up .hint{font-size:.72em;color:var(--t3);margin-top:2px;}

/* Processing */
.proc{background:var(--bg2);border:1px solid var(--accent);border-radius:var(--r);padding:18px;margin:14px 0;}
.ps{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:.82em;color:var(--t2);}
.ps.done{color:var(--accent);}
.ps.cur{color:var(--warn);font-weight:600;}
.spin{width:12px;height:12px;border:2px solid var(--brd);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Lecture split */
.ls{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:320px;}
.pnl{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;}
.ptabs{display:flex;border-bottom:1px solid var(--brd);}
.pt{padding:9px 14px;font-size:.78em;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--ff);}
.pt:hover{color:var(--text);}
.pt.ac{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.pct{flex:1;overflow-y:auto;padding:14px;font-size:.85em;line-height:1.75;max-height:340px;}
.tl{padding:5px 8px;border-radius:5px;cursor:pointer;transition:all .12s;display:flex;gap:8px;}
.tl:hover{background:var(--bg3);}
.tl.ac{background:var(--ad);border-left:3px solid var(--accent);padding-left:5px;}
.tt{font-size:.72em;color:var(--t3);min-width:58px;flex-shrink:0;font-variant-numeric:tabular-nums;}

/* Highlighted terms */
.hl{background:rgba(245,158,11,0.18);border-radius:3px;padding:1px 3px;cursor:pointer;border-bottom:1px dashed var(--warn);}
.hl:hover{background:rgba(245,158,11,0.3);}
.hl2{background:rgba(249,115,22,0.18);border-radius:3px;padding:1px 3px;cursor:pointer;border-bottom:1px dashed #F97316;}
.hl3{background:rgba(96,165,250,0.18);border-radius:3px;padding:1px 3px;cursor:pointer;border-bottom:1px dashed var(--info);}

/* Popup */
.pop{display:none;position:fixed;z-index:200;background:var(--bg2);border:1px solid var(--accent);border-radius:var(--r);padding:16px;min-width:260px;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,0.5);}
.pop.ac{display:block;}
.pop h4{color:var(--accent);margin-bottom:6px;}
.pop .def{font-size:.82em;color:var(--text);margin-bottom:4px;}
.pop .zh{font-size:.82em;color:var(--t2);margin-bottom:4px;}
.pop .an{font-size:.78em;color:var(--t3);font-style:italic;margin-bottom:8px;}
.pop .btns{display:flex;gap:6px;margin-top:8px;}

/* Review grid */
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;}
.rc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;transition:all .2s;}
.rc:hover{transform:translateY(-2px);}
.rc .ic{font-size:1.8em;margin-bottom:6px;}
.rc h4{font-size:.88em;margin-bottom:2px;}
.rc p{font-size:.75em;color:var(--t3);}

/* Search results */
.sr-item{padding:12px 16px;border-bottom:1px solid var(--brd);cursor:pointer;transition:all .15s;}
.sr-item:hover{background:var(--bg3);}
.sr-item .tp{font-size:.68em;color:var(--t3);}
.sr-item .tl{font-size:.82em;font-weight:600;}
.sr-item .ex{font-size:.75em;color:var(--t2);margin-top:2px;}

/* Modal */
.mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;}
.mod.ac{display:flex;}
.mod-inner{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:24px;min-width:380px;max-width:480px;}
.mod-inner h3{margin-bottom:14px;}
.mod-inner label{display:block;font-size:.8em;color:var(--t2);margin-bottom:4px;margin-top:10px;}
.mod-inner input{width:100%;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--brd);background:var(--bg);color:var(--text);font-size:.88em;outline:none;font-family:var(--ff);}
.mod-inner input:focus{border-color:var(--accent);}
.mod-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

/* Timeline */
.tmi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--brd);}
.tmi:last-child{border:none;}
.tld{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.tld.urg{background:var(--danger);animation:pulse 2s infinite;}
.tlv{margin-left:auto;font-weight:700;font-size:1.05em;}
.tlv.urg{color:var(--danger);}

/* Settings */
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--brd);}
.lec{display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:6px;cursor:pointer;}
.lec:hover{border-color:var(--accent);}
.lec .ln{font-size:1.3em;font-weight:800;color:var(--accent);min-width:35px;}
.lec .st{font-size:.68em;padding:2px 8px;border-radius:6px;}
.lec .st.done{background:var(--ad);color:var(--accent);}
.lec .st.wait,.lec .st.proc{background:var(--wd);color:var(--warn);}
.lec .st.err{background:rgba(239,68,68,0.15);color:var(--danger);}

/* Graph */
.gph{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:30px;text-align:center;margin-top:14px;}
.gn{padding:7px 14px;border-radius:18px;border:1px solid var(--brd);font-size:.8em;color:var(--t2);display:inline-block;margin:3px;}
.gn:hover{border-color:var(--accent);color:var(--accent);cursor:pointer;}
.gn.lg{font-size:.95em;font-weight:600;border-color:var(--accent);color:var(--accent);}

/* Flashcard */
.fc-grid{display:flex;justify-content:center;align-items:center;min-height:280px;perspective:1000px;}
.fc{width:320px;height:200px;position:relative;cursor:pointer;}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.fc.flipped .fc-inner{transform:rotateY(180deg);}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:2px solid var(--brd);}
.fc-front{background:var(--bg2);}
.fc-front h2{font-size:1.3em;color:var(--accent);text-align:center;}
.fc-back{background:var(--bg2);transform:rotateY(180deg);font-size:.82em;overflow-y:auto;align-items:flex-start;justify-content:flex-start;text-align:left;}
.fc-back h3{color:var(--accent);margin-bottom:6px;}
.fc-back .fc-def{color:var(--t2);margin-bottom:4px;}
.fc-back .fc-zh{color:var(--accent);margin-bottom:2px;}
.fc-back .fc-ana{color:var(--t3);font-style:italic;}
.fc-actions{display:flex;gap:12px;justify-content:center;margin-top:14px;}
.fc-actions button{padding:10px 28px;border-radius:var(--rs);font-size:.9em;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:var(--ff);}
.fc-know{background:var(--accent);color:#fff;}
.fc-know:hover{box-shadow:0 0 14px var(--ad);}
.fc-dk{background:var(--danger);color:#fff;}
.fc-dk:hover{box-shadow:0 0 14px rgba(239,68,68,0.3);}
.fc-stats{text-align:center;margin-top:14px;font-size:.85em;}
.fc-stats .good{color:var(--accent);font-weight:600;}
.fc-stats .bad{color:var(--danger);font-weight:600;}
.fc-progress{text-align:center;font-size:.78em;color:var(--t2);margin-bottom:8px;}

/* Knowledge Graph SVG */
#kgraph{width:100%;height:450px;display:block;}
#kgraph text{font-size:9px;fill:var(--text);text-anchor:middle;pointer-events:none;}
#kgraph line{stroke:var(--brd);stroke-opacity:0.5;}
#kgraph circle{cursor:pointer;stroke:var(--bg2);stroke-width:1.5;}

/* Review Outline */
.ol-section{margin-bottom:8px;}
.ol-hdr{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);cursor:pointer;font-size:.88em;font-weight:600;transition:all .2s;}
.ol-hdr:hover{border-color:var(--accent);}
.ol-hdr .arr{transition:transform .3s;font-size:.75em;color:var(--t3);}
.ol-hdr.open .arr{transform:rotate(90deg);}
.ol-body{display:none;padding:6px 0 6px 20px;}
.ol-body.open{display:block;}
.ol-item{padding:5px 10px;border-radius:5px;font-size:.8em;margin:2px 0;transition:all .15s;}
.ol-item:hover{background:var(--bg3);}
.ol-item .cn{font-weight:600;color:var(--accent);}
.ol-item .src{font-size:.7em;color:var(--t3);margin-top:1px;}
.ol-item .df{font-size:.75em;color:var(--t2);}
.ol-sub{padding-left:20px;}
.ol-gen{background:var(--ad);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:all .2s;text-align:center;margin-bottom:14px;}
.ol-gen:hover{box-shadow:0 0 18px var(--ad);}
.ol-load{text-align:center;padding:20px;color:var(--t2);}
.ol-method{font-size:.72em;color:var(--t3);margin-left:auto;}

/* Export dropdown */
.exp-wrap{position:relative;display:inline-block;}
.exp-btn{padding:6px 12px;border-radius:var(--rs);border:1px solid var(--brd);background:var(--bg);color:var(--t2);font-size:.78em;cursor:pointer;font-family:var(--ff);transition:all .2s;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.exp-btn:hover{border-color:var(--accent);color:var(--accent);}
.exp-menu{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);min-width:170px;z-index:50;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.35);}
.exp-menu.ac{display:block;}
.exp-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:.78em;color:var(--t2);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--ff);}
.exp-item:hover{background:var(--bg3);color:var(--text);}
.exp-item .ei{font-size:1.15em;}

/* Player bar */
.plb{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
#waveform{flex:1;height:80px;}
.plt{font-size:.8em;font-variant-numeric:tabular-nums;color:var(--t2);min-width:45px;text-align:center;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}

/* Quiz */
.quiz-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.quiz-card.correct{border-color:var(--accent);background:var(--ad);}
.quiz-card.wrong{border-color:var(--danger);}
.quiz-q{font-weight:600;margin-bottom:10px;font-size:.9em;}
.quiz-opt{padding:8px 12px;border-radius:6px;border:1px solid var(--brd);margin-bottom:4px;cursor:pointer;font-size:.82em;transition:all .15s;}
.quiz-opt:hover{background:var(--bg3);}
.quiz-opt.sel{background:var(--ad);border-color:var(--accent);}
.quiz-opt.correct{background:rgba(109,181,138,0.2);border-color:var(--accent);}
.quiz-opt.wrong{background:rgba(239,68,68,0.12);border-color:var(--danger);}
.quiz-exp{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:6px;font-size:.78em;color:var(--t2);}
.quiz-sa{width:100%;padding:8px;border-radius:6px;border:1px solid var(--brd);background:var(--bg);color:var(--text);font-family:var(--ff);font-size:.82em;resize:vertical;min-height:60px;outline:none;}
.quiz-sa:focus{border-color:var(--accent);}
.quiz-score{text-align:center;padding:14px;font-size:1.2em;font-weight:700;}

/* Notes */
.note-item{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:8px;}
.note-item .nt{font-size:.72em;color:var(--t3);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.note-item .nc{font-size:.82em;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.note-item .na{display:flex;gap:6px;margin-top:6px;}
.note-input{width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:10px;color:var(--text);font-size:.82em;resize:vertical;min-height:70px;font-family:var(--ff);outline:none;margin-top:6px;}
.note-input:focus{border-color:var(--accent);}
.note-hint{font-size:.7em;color:var(--t3);margin-top:4px;text-align:center;}

/* Bilingual */
.bil-container{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:340px;}
.bil-col{background:var(--bg2);border:1px solid var(--brd);overflow:hidden;display:flex;flex-direction:column;}
.bil-col:first-child{border-radius:var(--r) 0 0 var(--r);}
.bil-col:last-child{border-radius:0 var(--r) var(--r) 0;}
.bil-head{padding:7px 14px;font-size:.75em;font-weight:600;border-bottom:1px solid var(--brd);color:var(--t2);background:var(--bg3);}
.bil-body{flex:1;overflow-y:auto;padding:10px;font-size:.82em;line-height:1.7;max-height:340px;}
.bil-body .tl{cursor:pointer;}
.bil-body .tl:hover{background:var(--bg3);}

@media(max-width:768px){
  .bil-container{grid-template-columns:1fr;}
  .bil-col:first-child,.bil-col:last-child{border-radius:var(--r);}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sb">
    <div class="lg" onclick="goPage('dashboard')"><div class="d"></div>LectureVault</div>
    <button class="si ac" onclick="goPage('dashboard')" data-pg="dashboard"><span class="ic">📊</span>总仪表盘</button>
    <button class="si" onclick="goPage('courses')" data-pg="courses"><span class="ic">📚</span>课程目录<span class="sb-badge" id="courseBadge">0</span></button>
    <div class="divider"></div>
    <div class="cm" id="sidebarCourses"><div style="font-size:.72em;color:var(--t3);padding:6px 12px;">暂无课程</div></div>
    <div class="divider"></div>

<div id="procArea" style="position:fixed;bottom:16px;right:16px;z-index:50;"></div>

<script>
// ======= BACKEND CONFIG =======
const API = 'http://127.0.0.1:8766';
let wavesurfer = null;

// ======= DATA STORE =======
const DB = {
  _k:'lv_data',
  d:null,
  load(){try{this.d=JSON.parse(localStorage.getItem(this._k))}catch(e){}
    if(!this.d||!this.d.v){this.d={v:2,courses:[],st:{theme:'dark',speed:1,backend:true},vocab:[]};this.save()}
    return this.d;
  },
  save(){localStorage.setItem(this._k,JSON.stringify(this.d))},
  refresh(){
    document.getElementById('courseBadge').textContent=this.d.courses.length;
    document.getElementById('vocabBadge').textContent=this.d.vocab.length;
    const sc=document.getElementById('sidebarCourses');
    if(this.d.courses.length===0){sc.innerHTML='<div style="font-size:.72em;color:var(--t3);padding:6px 12px;">暂无课程</div>';}
    else{sc.innerHTML=this.d.courses.map(c=>`<div class="ci" onclick="goPage('course','${c.id}')"><span class="dot" style="background:${c.color}"></span>${c.name}</div>`).join('');}
  },
  course(id){return this.d.courses.find(c=>c.id===id);},
  lecture(cid,lid){const c=this.course(cid);return c?c.lectures.find(l=>l.id===lid):null;},
  addCourse(nm,cd,sm){
    const cls=['#6DB58A','#60A5FA','#F59E0B','#C084FC','#FB7185','#38BDF8'];
    const c={id:'c'+Date.now(),name:nm,code:cd,semester:sm,color:cls[this.d.courses.length%6],lectures:[],cts:Date.now()};
    this.d.courses.push(c);this.save();this.refresh();return c;
  },
  deleteCourse(id){this.d.courses=this.d.courses.filter(c=>c.id!==id);this.save();this.refresh();},
  addLecture(cid,title,audioFile,duration){
    const c=this.course(cid);if(!c)return null;
    const l={id:'l'+Date.now(),title,audioFileName:audioFile.name,audioSize:audioFile.size,duration:duration||0,transcript:null,concepts:[],assignments:[],examInfo:[],alerts:[],notes:[],quizzes:[],status:'uploaded',cts:Date.now()};
    c.lectures.unshift(l);this.save();this.refresh();return l;
  },
  updateLecture(cid,lid,data){
    const c=this.course(cid);if(!c)return;
    const l=c.lectures.find(x=>x.id===lid);if(!l)return;
    Object.assign(l,data);this.save();
  },
  deleteLecture(cid,lid){
    const c=this.course(cid);if(!c)return;
    c.lectures=c.lectures.filter(l=>l.id!==lid);
    // Clean up OPFS
    const opfsDir=`${cid}/${lid}`;
    navigator.storage?.getDirectory().then(root=>root.removeEntry(opfsDir,{recursive:true}).catch(()=>{}));
    this.save();this.refresh();
  },
  addVocab(term,enDef,zhDef,zhAna,courseId){
    if(this.d.vocab.find(v=>v.term===term))return;
    this.d.vocab.push({term,enDef,zhDef,zhAna,courseId,added:Date.now(),mastered:false});
    this.save();this.refresh();
  },
  searchAll(q){
    const lq=q.toLowerCase();const r=[];
    this.d.courses.forEach(c=>{
      if(c.name.toLowerCase().includes(lq)||c.code.toLowerCase().includes(lq)) r.push({type:'📚 课程',title:c.name+' ('+c.code+')',cid:c.id});
      c.lectures.forEach(l=>{
        if(l.title.toLowerCase().includes(lq)) r.push({type:'📖 课时',title:l.title,sub:c.name,cid:c.id,lid:l.id});
        if(l.transcript) l.transcript.forEach(s=>{if(s.text.toLowerCase().includes(lq)) r.push({type:'📝 文稿',title:s.text.substring(0,70)+'...',sub:`${c.name} · ${fmtTime(s.start)}`,cid:c.id,lid:l.id});});
        (l.concepts||[]).forEach(k=>{if(k.concept.toLowerCase().includes(lq)) r.push({type:'🧠 知识点',title:k.concept,sub:`${c.name} · ${l.title}`,cid:c.id,lid:l.id});});
      });
    });
    this.d.vocab.forEach(v=>{if(v.term.toLowerCase().includes(lq)||v.zhDef.toLowerCase().includes(lq)) r.push({type:'📖 生词',title:v.term+' → '+v.zhDef});});
    return r.slice(0,20);
  }
};

// ======= OPFS STORE =======
async function opfsSave(cid,lid,file){
  try{
    const root=await navigator.storage.getDirectory();
    const cDir=await root.getDirectoryHandle(cid,{create:true});
    const lDir=await cDir.getDirectoryHandle(lid,{create:true});
    const fh=await lDir.getFileHandle(file.name,{create:true});
    const w=await fh.createWritable();
    await w.write(file);
    await w.close();
    return true;
  }catch(e){console.error('OPFS save error:',e);return false;}
}
async function opfsGetUrl(cid,lid,fname){
  try{
    const root=await navigator.storage.getDirectory();
    const lDir=await root.getDirectoryHandle(cid+'/'+lid);
    const fh=await lDir.getFileHandle(fname);
    const file=await fh.getFile();
    return URL.createObjectURL(file);
  }catch(e){return null;}
}

// ======= HELPERS =======
function fmtTime(s){if(!s&&s!==0)return'--:--';const m=Math.floor(s/60),sec=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('zh-CN',{month:'short',day:'numeric'});}
function fmtDateFull(ts){return new Date(ts).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});}
function daysUntil(ts){return Math.ceil((ts-Date.now())/86400000);}
let _cc=null,_cl=null;

// ======= THEME =======
function toggleTheme(){document.body.classList.toggle('light');DB.d.st.theme=document.body.classList.contains('light')?'light':'dark';DB.save();}
function applyTheme(){if(DB.d.st.theme==='light')document.body.classList.add('light');}

// ======= NAVIGATION =======
function goPage(pg,param){
  document.querySelectorAll('.si[data-pg]').forEach(s=>s.classList.remove('ac'));
  const sel=document.querySelector(`.si[data-pg="${pg}"]`);
  if(sel)sel.classList.add('ac');
  _cc=null;_cl=null;document.getElementById('popup').classList.remove('ac');

  switch(pg){
    case'dashboard':rDashboard();break;
    case'courses':rCourses();break;
    case'course':_cc=DB.course(param);rCourseDetail();break;
    case'lecture':{
      const[ci,li]=param.split('/');_cc=DB.course(ci);_cl=_cc?DB.lecture(ci,li):null;
      rLectureDetail();break;
    }
    case'search':rSearch();break;
    case'vocab':rVocab();break;
    case'chat':rChat();break;
    case'schedule':rSchedule();break;
    case'settings':rSettings();break;
  }
  document.getElementById('ct').scrollTop=0;
  document.getElementById('popup').classList.remove('ac');
  // Reset wavesurfer
  if(wavesurfer){wavesurfer.destroy();wavesurfer=null;}
}

function modal(title,body,onOk,okText='确认'){

  document.getElementById('modal').classList.add('ac');
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('ac');});

// ======= DASHBOARD =======
function rDashboard(){
  const cs=DB.d.courses;let tl=0,rc=0;
  cs.forEach(c=>{tl+=c.lectures.length;c.lectures.forEach(l=>{if(l.status==='ready')rc++;});});
  const pa=[];cs.forEach(c=>c.lectures.forEach(l=>(l.assignments||[]).forEach(a=>{if(!a.done)pa.push({...a,cn:c.name,cid:c.id,lid:l.id});})));

  if(cs.length===0){
    document.getElementById('ct').innerHTML=`<div class="emp"><div class="ic">🎓</div><h2>欢迎来到 LectureVault</h2><p>上传课堂录音，AI自动转录+提取知识点</p><div style="margin-top:16px;display:flex;gap:10px;justify-content:center;"><button class="btn btn-p" onclick="rNewCourseModal()">➕ 创建课程</button></div><p style="font-size:.7em;color:var(--t3);margin-top:12px;">需要先启动后端服务: python3 server.py</p></div>`;
    return;
  }

  let h=`<h1>📊 学习概览</h1><p class="sub">${cs.length}门课程 · ${tl}课时</p>`;
  h+=`<div class="kpi-grid">
    <div class="kpi"><div class="l">已完成课时</div><div class="v g">${rc}</div><div class="s">共${tl}课时</div></div>
    <div class="kpi"><div class="l">待复习</div><div class="v a">${tl-rc}</div><div class="s">${pa.length}个待交作业</div></div>
    <div class="kpi"><div class="l">生词积累</div><div class="v b">${DB.d.vocab.length}</div><div class="s">跨${cs.length}门课程</div></div>
    <div class="kpi"><div class="l">掌握率</div><div class="v g">${tl?Math.round(rc/tl*100):0}%</div><div class="s">已完成/总课时</div></div></div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><strong>📈 课程进度</strong><button class="btn btn-sm btn-o" onclick="rNewCourseModal()">➕ 新建</button></div>`;
  cs.forEach(c=>{
    const done=c.lectures.filter(l=>l.status==='ready').length;
    const pct=c.lectures.length?Math.round(done/c.lectures.length*100):0;
    const ci=cs.indexOf(c)%4;const cls=['cg','cb','ca','cp'][ci];
    h+=`<div class="card" onclick="goPage('course','${c.id}')"><h3>${c.name} <span style="font-size:.75em;color:var(--t3);">${c.code}</span></h3><div style="font-size:.75em;color:var(--t2);margin:4px 0;">📖 ${c.lectures.length}课时 · ✅ ${done}完成</div><div class="progress"><div class="pfill ${cls}" style="width:${pct}%"></div></div></div>`;
  });

  // Deadlines
  const dd=[];
  cs.forEach(c=>c.lectures.forEach(l=>{(l.examInfo||[]).forEach(e=>{if(!e.passed)dd.push({...e,type:'考试',cn:c.name,cid:c.id,lid:l.id});});}));
  pa.forEach(a=>dd.push({...a,type:'作业'}));
  dd.sort((a,b)=>daysUntil(a.due_date||a.dueDate||Date.now())-daysUntil(b.due_date||b.dueDate||Date.now()));
  if(dd.length){
    h+=`<div class="card" style="cursor:default;margin-top:14px;"><strong style="margin-bottom:10px;display:block;">⏰ 倒计时</strong>`;
    dd.slice(0,5).forEach(d=>{
      const days=daysUntil(d.due_date||d.dueDate||Date.now());const urg=days<=7;
      h+=`<div class="tmi"><div class="tld${urg?' urg':''}"></div><div><strong>${d.type}: ${d.description||d.cn}</strong><div style="font-size:.75em;color:var(--t2);">${d.cn||''} · ${(d.due_date||d.dueDate)?fmtDateFull(d.due_date||d.dueDate):''}</div></div><div class="tlv${urg?' urg':''}">${days}天</div></div>`;
    });
    h+=`</div>`;
  }
  document.getElementById('ct').innerHTML=h;
}

// ======= COURSE DETAIL =======
function rCourseDetail(){

  h+=`<div class="up" id="upZone" onclick="document.getElementById('afInput').click()"><div class="ic">🎙️</div><p>上传课堂录音</p><p class="hint">.mp3 .m4a .wav .ogg .flac</p></div><input type="file" id="afInput" accept="audio/*" style="display:none" onchange="handleUpload(this)">`;
  h+=`<div id="procSpot"></div>`;

  if(c.lectures.length===0){
    h+=`<div class="emp" style="padding:30px;"><p style="font-size:2em;">📖</p><p>还没有课时，上传录音开始</p></div>`;
  }else{
    h+=`<div style="font-weight:600;margin:14px 0 6px;">📖 课时列表</div>`;
    c.lectures.forEach((l,i)=>{
      let st,lb,clk=`onclick="goPage('lecture','${c.id}/${l.id}')"`;
      if(l.status==='ready'){
        st='done';lb='✅ 已完成';
      }else if(l.status==='processing'){
        st='proc';lb='<span class="spin"></span> 处理中...';
      }else if(l.status==='error'){
        st='err';lb='❌ 失败';
        clk=''; // No click - show retry instead
      }else{
        st='wait';lb='⬜ 待处理';
      }
      h+=`<div class="lec" ${clk}><div class="ln">${c.lectures.length-i}</div><div style="flex:1;"><div style="font-weight:600;">${l.title}</div><div style="font-size:.75em;color:var(--t2);">${fmtDateFull(l.cts)} · ${l.duration?Math.round(l.duration/60)+'分钟':''} · ${l.audioFileName||''}</div>${l.status==='error'?'<div style="font-size:.72em;color:var(--danger);margin-top:2px;">'+((l.errorMsg||'未知错误').substring(0,80))+'</div><button class="btn btn-o btn-sm" style="margin-top:4px;" onclick="event.stopPropagation();retryLecture(\''+c.id+'\',\''+l.id+'\')">🔄 重试</button><button class="btn btn-sm btn-d" style="margin-left:4px;margin-top:4px;" onclick="event.stopPropagation();delLecture(\''+c.id+'\',\''+l.id+'\')">🗑</button>':''}</div><span class="st ${st}">${lb}</span></div>`;
    });
    // Knowledge Graph section
    const totalConcepts = c.lectures.reduce((s,l) => s + (l.concepts||[]).length, 0);

  if(c.lectures.length>0) setTimeout(()=>renderKnowledgeGraph(c.id), 300);
}

// ======= UPLOAD & PROCESSING =======
async function handleUpload(input){
  const f=input.files[0];if(!f)return;
  await processUpload(f);
}

async function processUpload(file){
  if(!_cc){alert('请先选择课程');return;}
  if(!file.type.startsWith('audio/')&&!file.name.match(/\.(mp3|m4a|wav|ogg|flac|webm)$/i)){alert('请选择音频文件');return;}

  // Get duration
  let dur=0;
  try{
    const a=new Audio(URL.createObjectURL(file));
    dur=await new Promise(r=>{a.addEventListener('loadedmetadata',()=>r(a.duration));a.addEventListener('error',()=>r(0));});
  }catch(e){}

  const title=`第${_cc.lectures.length+1}课：${file.name.replace(/\.[^.]+$/,'')}`;
  const l=DB.addLecture(_cc.id,title,file,dur);

  // Save to OPFS (non-blocking: don't delete lecture on failure)
  const saved=await opfsSave(_cc.id,l.id,file);
  if(!saved){console.warn('OPFS save failed, continuing with in-memory only');}
  
  // Always show processing
  DB.updateLecture(_cc.id,l.id,{status:'processing'});
  const ps=document.getElementById('procSpot');
  if(ps)ps.innerHTML='<div class="proc"><strong>🤖 AI处理中 — '+file.name+'</strong><div id="procSteps"><div class="ps cur"><span class="spin"></span> 上传音频...</div><div class="ps">⏳ 语音识别 (Whisper large-v3 GPU)...</div><div class="ps">⏳ AI提取知识点 (DeepSeek)...</div><div class="ps">⏳ 生成复习资料...</div></div></div>';

  try{
    await sleep(800);
    updateProc(0,'done','✅ 音频保存完成');
    updateProc(1,'cur','⏳ 转录中...（大文件需几分钟）');
    
    const fd=new FormData();
    fd.append('file',file);
    // Step 1: Start transcription (returns job_id for progress tracking)
    const tResp=await fetch(API+'/transcribe?course='+encodeURIComponent(_cc?.name||'')+'&code='+encodeURIComponent(_cc?.code||''),{method:'POST',body:fd});
    if(!tResp.ok){const et=await tResp.text();throw new Error('转录启动失败('+tResp.status+'): '+et.substring(0,120));}
    const tStart=await tResp.json();
    if(!tStart.job_id)throw new Error('后端未返回任务ID');
    const estSec=tStart.estimated_seconds||60;
    
    updateProc(1,'cur','⏳ 转录中... (预计 '+(estSec>60?Math.round(estSec/60)+'分钟':Math.round(estSec)+'秒')+')');
    // Poll progress — up to 30 minutes for long recordings
    let tData=null,consecutive404=0;
    for(let i=0;i<2250;i++){ // 2250 * 0.8s = 30 minutes
      await sleep(800);
      try{
        const pResp=await fetch(API+'/progress/'+tStart.job_id);
        if(!pResp.ok){
          consecutive404++;
          if(consecutive404>15) throw new Error('后端无响应（可能内存不足重启了）。请重试。');
          continue;
        }
        consecutive404=0;
        const pData=await pResp.json();
        const pct=pData.progress||0;
        const remain=estSec*(1-pct/100);
        updateProc(1,'cur','⏳ 转录中... '+pct+'% ('+(remain>60?Math.round(remain/60)+'分钟':Math.round(remain)+'秒')+' 剩余)');
        if(pData.status==='done'&&pData.result){
          tData=pData.result;break;
        }
        if(pData.status==='error'){
          throw new Error('转录失败: '+(pData.error||'未知错误'));
        }
      }catch(e){if(e.message.startsWith('转录失败')||e.message.startsWith('后端无响应'))throw e;}
    }
    if(!tData)throw new Error('转录超时。2小时录音预计6分钟，如有问题请查看后端日志。');
    
    updateProc(1,'done','✅ 转录完成 ('+(tData.segments||[]).length+'段, '+Math.round(tData.duration||0)+'秒)');
    updateProc(2,'cur','⏳ AI分析中...');

    // Step 2: Analyze (try LLM, fallback to local)
    let concepts=[],assignments=[],examInfo=[],alerts=[];
    try{
      const aResp=await fetch(API+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(tData.segments)});
      if(aResp.ok){
        const aData=await aResp.json();
        concepts=aData.concepts||[];assignments=aData.assignments||[];examInfo=aData.exam_info||[];alerts=aData.alerts||[];
      }else{
        throw new Error('LLM unavailable');
      }
    }catch(e){
      // Fallback: basic extraction
      concepts=basicExtract(tData.segments);
      assignments=[];examInfo=[];alerts=[];
    }
    updateProc(2,'done',`✅ 提取完成 (${concepts.length}个知识点)`);
    updateProc(3,'cur','⏳ 翻译文稿中...');

    // Step 3: Translate transcript to Chinese
    let translations={};
    try{
      const trResp=await fetch(API+'/translate-transcript',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segments:tData.segments})});
      if(trResp.ok){
        const trData=await trResp.json();
        translations=trData.segments||[];
      }
    }catch(e){console.warn('Translation failed:',e);}
    updateProc(3,'done',`✅ 翻译完成 (${translations.length||0}段)`);

    // Save
    DB.updateLecture(_cc.id,l.id,{status:'ready',transcript:tData.segments,duration:tData.duration,concepts,assignments,examInfo,alerts,notes:[],translations});
    DB.refresh();

    if(ps)ps.innerHTML=`<div class="card" style="border-color:var(--accent);"><strong style="color:var(--accent);">✅ 处理完成！</strong><p style="font-size:.82em;color:var(--t2);">${tData.segments.length}段文稿 · ${concepts.length}个知识点</p><button class="btn btn-p btn-sm" style="margin-top:6px;" onclick="goPage('lecture','${_cc.id}/${l.id}')">📖 查看 →</button></div>`;

  }catch(e){
    console.error(e);
    DB.updateLecture(_cc.id,l.id,{status:'error',errorMsg:e.message||String(e)});
    // Show error inline without destroying the page
    if(ps){
      ps.innerHTML='<div class="card" style="border-color:var(--danger);margin-bottom:14px;"><strong style="color:var(--danger);">❌ 处理失败</strong><p style="font-size:.82em;color:var(--t2);margin:6px 0;">'+e.message+'</p><p style="font-size:.75em;color:var(--t3);">后端运行中？ curl http://127.0.0.1:8766/health</p><button class="btn btn-o btn-sm" style="margin-top:6px;" onclick="rCourseDetail()">🔄 刷新列表</button></div>';
      return;
    }
  }
  rCourseDetail();
}


function delLecture(cid,lid){
  if(confirm("删除这个课时？音频和文稿都会被清除。")){
    DB.deleteLecture(cid,lid);
    rCourseDetail();
  }
}

async function retryLecture(cid,lid){
  _cc=DB.course(cid);
  if(!_cc)return;
  const l=_cc.lectures.find(x=>x.id===lid);
  if(!l)return;
  // Need the file - try OPFS first, then in-memory
  let file=null;
  try{
    const root=await navigator.storage.getDirectory();
    const lDir=await root.getDirectoryHandle(cid+'/'+lid);
    const fh=await lDir.getFileHandle(l.audioFileName);
    file=await fh.getFile();
  }catch(e){}
  
  if(!file){alert('音频文件已丢失（可能在清除浏览器数据时被删除）。请重新上传。');return;}
  
  // Reset status and re-process
  DB.updateLecture(cid,lid,{status:'processing',errorMsg:''});
  rCourseDetail(); // Show processing state
  
  // Wait for DOM update
  await sleep(100);
  await processUpload(file);
}


async function translateNow(cid,lid){
  _cc=DB.course(cid);if(!_cc)return;
  const l=_cc.lectures.find(x=>x.id===lid);if(!l||!l.transcript)return;
  
  // Show progress
  const h=document.createElement('div');
  h.className='proc';h.style.margin='12px 0';
  h.innerHTML='<div class="ps cur"><span class="spin"></span> ⏳ 正在翻译文稿...</div>';
  const ct=document.getElementById('ct');
  if(ct)ct.insertBefore(h,ct.firstChild.nextSibling);
  
  try{
    const r=await fetch(API+'/translate-transcript',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segments:l.transcript})});
    if(!r.ok)throw new Error('翻译失败: '+r.status);
    const d=await r.json();
    DB.updateLecture(cid,lid,{translations:d.segments||[]});
    DB.refresh();
    goPage('lecture',cid+'/'+lid);
  }catch(e){
    h.innerHTML='<div class="card" style="border-color:var(--danger);"><strong style="color:var(--danger);">❌ 翻译失败</strong><p style="font-size:.82em;">'+e.message+'</p></div>';
  }
}

function updateProc(idx,cls,text){
  const st=document.getElementById('procSteps');
  if(!st)return;
  const ps=st.querySelectorAll('.ps');
  if(ps[idx]){ps[idx].className='ps '+cls;if(text)ps[idx].innerHTML=text;}
}

function basicExtract(segments){
  // Simple keyword-based extraction when LLM unavailable
  const text=segments.map(s=>s.text).join(' ').toLowerCase();
  const keywords=['perfect competition','monopoly','elasticity','utility','marginal','profit','demand','supply','equilibrium','cost','price','consumer','producer','market','competition','oligopoly','game theory','externality','welfare','shutdown'];
  const found=keywords.filter(k=>text.includes(k)).slice(0,8);
  return found.map(k=>({concept:k.replace(/\b\w/g,c=>c.toUpperCase()),definition:'(需要LLM生成详细释义 — 请设置DEEPSEEK_API_KEY)',category:'概念',timestamp:0}));
}

function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hlText(text,lecture){
  let t=text;
  (lecture.concepts||[]).forEach(k=>{
    const re=new RegExp(`\\b${k.concept.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'gi');
    t=t.replace(re,m=>`<span class="hl" data-term="${escAttr(k.concept)}" onclick="event.stopPropagation();clickTerm(event,this.dataset.term)">${m}</span>`);
  });
  t=t.replace(/(assignment|homework|due\s+date|exam|midterm|final|office\s+hours|quiz)/gi,m=>`<span class="hl2">${m}</span>`);
  return t;
}

// ======= WAVESURFER =======
async function initWaveSurfer(){
  const waveformDiv=document.getElementById('waveform');
  if(!waveformDiv||!_cl||!_cl.audioFileName){
    // No waveform needed - use plain audio
    const a=document.querySelector('#fallbackAudio');
    if(a){a.style.display='';setupFallbackAudio(a);}
    return;
  }
  const url=await opfsGetUrl(_cc.id,_cl.id,_cl.audioFileName);
  if(!url){
    waveformDiv.innerHTML='<p style="color:var(--t3);text-align:center;padding:20px;">音频文件不可用（可能已被清除）</p>';
    return;
  }

  if(wavesurfer){wavesurfer.destroy();wavesurfer=null;}
  
  try{
    const WaveSurfer=(await import('https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js')).default;
    wavesurfer=WaveSurfer.create({
      container:'#waveform',url,height:64,waveColor:'var(--accent)',progressColor:'var(--warn)',
      cursorColor:'var(--text)',barWidth:2,barGap:1,barRadius:2,
    });
    wavesurfer.on('timeupdate',t=>{
      const td=document.getElementById('timeDisplay');if(td)td.textContent=fmtTime(t);
      document.querySelectorAll('.tl').forEach(line=>{const lt=parseFloat(line.dataset.t);line.classList.toggle('ac',lt<=t&&(!line.nextElementSibling||parseFloat(line.nextElementSibling.dataset.t)>t||!line.nextElementSibling.dataset.t));});
    });
    wavesurfer.on('ready',()=>{const td=document.getElementById('timeDisplay');if(td)td.textContent='00:00';});
  }catch(e){console.warn('Wavesurfer failed, using fallback:',e);wavesurfer=null;}
  
  // Always set up fallback audio element
  const a=document.querySelector('#fallbackAudio');
  if(a){a.src=url;a.style.display=wavesurfer?'none':'';if(!wavesurfer)setupFallbackAudio(a);}
}

function setupFallbackAudio(a){
  a.addEventListener('timeupdate',()=>{
    const td=document.getElementById('timeDisplay');if(td)td.textContent=fmtTime(a.currentTime);
  });
  a.addEventListener('loadedmetadata',()=>{
    const td=document.getElementById('timeDisplay');if(td)td.textContent='00:00';
  });
}

function togglePlay(){
  if(wavesurfer){wavesurfer.playPause();return;}
  const a=document.querySelector('#fallbackAudio');
  if(!a)return;
  if(a.paused){a.play();document.getElementById('playBtn').textContent='⏸';}
  else{a.pause();document.getElementById('playBtn').textContent='▶';}
}
function jumpTo(t){
  if(wavesurfer){wavesurfer.setTime(t);wavesurfer.play();return;}
  const a=document.querySelector('#fallbackAudio');
  if(a){a.currentTime=t;a.play();document.getElementById('playBtn').textContent='⏸';}
}
function changeSpeed(){
  const s=parseFloat(document.getElementById('spd').value);
  if(wavesurfer)wavesurfer.setPlaybackRate(s);
  const a=document.querySelector('#fallbackAudio');if(a)a.playbackRate=s;
}

// ======= TERM POPUP =======
async function clickTerm(event,term){
  const pop=document.getElementById('popup');
  // Try backend
  let enDef='',zhDef='',zhAna='';
  try{
    const r=await fetch(API+'/translate-term',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({term,context:_cc?`${_cc.name} lecture`:''})});
    if(r.ok){const d=await r.json();enDef=d.en_definition||'';zhDef=d.zh_translation||'';zhAna=d.zh_analogy||'';}
  }catch(e){}

  if(!enDef){
    // Fallback: try to find in lecture concepts (including zh_translation/zh_analogy)
    const concept=(_cl?.concepts||[]).find(k=>k.concept.toLowerCase()===term.toLowerCase());
    if(concept){enDef=concept.definition||'';zhDef=concept.zh_translation||'';zhAna=concept.zh_analogy||'';}
  }

  // Store data on popup element for button handlers (avoids inline onclick escaping)
  pop._vocabData={term,enDef,zhDef,zhAna,courseId:_cc?.id||''};

  pop.innerHTML=
    `<h4>📖 ${escHtml(term)}</h4>`+
    `<div class="def">${escHtml(enDef||'暂无释义')}</div>`+
    `<div class="zh">🇨🇳 ${escHtml(zhDef||'（暂无中文翻译）')}</div>`+
    (zhAna?`<div class="an">💡 ${escHtml(zhAna)}</div>`:'')+
    `<div class="btns">`+
      `<button class="btn btn-p btn-sm" id="popAddVocab">📖 加入生词本</button>`+
      `<button class="btn btn-o btn-sm" id="popClose">关闭</button>`+
    `</div>`;

  // Attach DOM event handlers (no inline onclick with broken escaping)
  const addBtn=document.getElementById('popAddVocab');
  if(addBtn)addBtn.onclick=()=>{
    const d=pop._vocabData;
    if(d)DB.addVocab(d.term,d.enDef,d.zhDef,d.zhAna,d.courseId);
    DB.refresh();pop.classList.remove('ac');
  };
  const closeBtn=document.getElementById('popClose');
  if(closeBtn)closeBtn.onclick=()=>pop.classList.remove('ac');

  pop.style.left=(event.clientX+10)+'px';pop.style.top=(event.clientY-10)+'px';
  pop.classList.add('ac');
  setTimeout(()=>{document.addEventListener('click',function cp(e){if(!pop.contains(e.target)&&!e.target.classList.contains('hl')){pop.classList.remove('ac');document.removeEventListener('click',cp);}});},100);
}

            </div>`
          ).join('')
        : '<div style="color:var(--t3);text-align:center;padding:30px;">暂无作业</div>';
      break;
    case 3: // 📅 考试 — examInfo with zh_description
      lp.innerHTML=(l.examInfo||[]).length
        ? (l.examInfo||[]).map(e=>
            `<div style="padding:10px 8px;border-bottom:1px solid var(--brd);margin-bottom:4px;font-size:.82em;">
              <strong style="color:var(--danger);">📅 ${e.description||'考试安排'}</strong>
              ${e.zh_description?`<div style="color:var(--accent);margin-top:2px;">🇨🇳 ${e.zh_description}</div>`:''}
              ${e.due_date||e.dueDate?`<div style="color:var(--danger);margin-top:2px;font-size:.78em;">📆 日期: ${fmtDateFull(e.due_date||e.dueDate)}</div>`:''}
            </div>`
          ).join('')
        : '<div style="color:var(--t3);text-align:center;padding:30px;">暂无考试信息</div>';
      break;
    case 4: // ⚠️ 注意事项 — alerts with zh_content
      lp.innerHTML=(l.alerts||[]).length
        ? (l.alerts||[]).map(a=>{
            const txt=typeof a==='string'?a:(a.description||a.content||a.cn||a.alert||JSON.stringify(a));
            const zh=typeof a==='object'?(a.zh_description||a.zh_content):'';
            return `<div style="padding:10px 8px;border-bottom:1px solid var(--brd);margin-bottom:4px;font-size:.82em;">
              <strong>⚠️ ${txt}</strong>
              ${zh?`<div style="color:var(--accent);margin-top:2px;">🇨🇳 ${zh}</div>`:''}
              ${a.importance?`<span class="tag" style="font-size:.68em;margin-left:6px;background:var(--wd);color:var(--warn);">${a.importance}</span>`:''}
            </div>`;
          }).join('')
        : '<div style="color:var(--t3);text-align:center;padding:30px;">暂无注意事项</div>';
      break;
  }
}

// ======= VOCAB =======
let _fcState=null; // {cards:[], idx:0, round:1, known:[], unknown:[], flipped:false}
function rVocab(){
  let h=`<h1>📖 生词本</h1><p class="sub">${DB.d.vocab.length}个术语</p>`;
  if(!DB.d.vocab.length){h+=`<div class="emp"><div class="ic">📖</div><h2>空</h2><p>在课时中点击术语→加入生词本</p></div>`;}
  else{
    h+=`<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-p" onclick="startFlashcards()">🎯 开始背诵</button>
      <button class="btn btn-o btn-sm" onclick="rVocab()">📋 列表视图</button>
    </div>`;
    h+=`<div id="vocabView"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;">`;
    DB.d.vocab.forEach(v=>h+=`<div class="card" style="cursor:default;"><div style="font-size:.72em;color:var(--t3);">${v.mastered?'⭐ 已掌握':'⬜ 待复习'}</div><strong>${v.term}</strong><div style="font-size:.82em;color:var(--t2);">🇨🇳 ${v.zhDef||''}</div><div style="font-size:.72em;color:var(--t3);margin-top:2px;">${v.enDef||''}</div><button class="btn btn-sm btn-o" style="margin-top:6px;" onclick="v.mastered=!v.mastered;DB.save();rVocab();">${v.mastered?'标记待复习':'标记已掌握'}</button></div>`);
    h+=`</div></div>`;
  }
  document.getElementById('ct').innerHTML=h;
  // Reset flashcard state
  _fcState=null;
}

function startFlashcards(){
  const cards=DB.d.vocab.filter(v=>!v.mastered);
  if(cards.length===0){alert('所有生词已掌握！');return;}
  // Shuffle
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  _fcState={cards, idx:0, round:1, known:[], unknown:[], flipped:false, totalRounds:0};
  renderFlashcard();
}

function renderFlashcard(){
  const s=_fcState; if(!s) return;
  const total=s.cards.length;
  const card=s.cards[s.idx];
  let h='';
  // Progress
  h+=`<div class="fc-progress">第${s.round}轮 · ${s.idx+1}/${total} · ✅${s.known.length} ✗${s.unknown.length}</div>`;
  // Card
  h+=`<div class="fc-grid"><div class="fc${s.flipped?' flipped':''}" id="fcCard" onclick="${s.flipped?'':'flipCard()'}">
    <div class="fc-inner">
      <div class="fc-front"><h2>${card.term}</h2><p style="font-size:.72em;color:var(--t3);margin-top:4px;">点击翻转</p></div>
      <div class="fc-back">
        <h3>${card.term}</h3>
        ${card.zhDef?`<div class="fc-zh">🇨🇳 ${card.zhDef}</div>`:''}
        ${card.enDef?`<div class="fc-def">📖 ${card.enDef}</div>`:''}
        ${card.zhAna?`<div class="fc-ana">💡 ${card.zhAna}</div>`:''}
      </div>
    </div>
  </div></div>`;
  // Action buttons
  h+=`<div class="fc-actions">`;
  if(s.flipped){
    h+=`<button class="fc-know" onclick="fcAnswer(true)">✅ 认识</button>`;
    h+=`<button class="fc-dk" onclick="fcAnswer(false)">✗ 不认识</button>`;
  }
  h+=`</div>`;
  // Stats when round done
  if(s.idx>=total-1 && s.flipped){
    h+=`<div class="fc-stats"><p>本轮完成！</p><p>✅ <span class="good">${s.known.length}</span> 认识 · ✗ <span class="bad">${s.unknown.length}</span> 不认识</p></div>`;
  }
  document.getElementById('vocabView').innerHTML=h;
}

function flipCard(){
  if(!_fcState||_fcState.flipped)return;
  _fcState.flipped=true;
  renderFlashcard();
}

function fcAnswer(knew){
  if(!_fcState) return;
  const s=_fcState;
  const card=s.cards[s.idx];
  if(knew){
    s.known.push(card);
    // Mark as mastered if known twice
    if(!card._knownCount)card._knownCount=0;
    card._knownCount++;
    if(card._knownCount>=2){card.mastered=true;}
  }else{
    s.unknown.push(card);
  }
  s.flipped=false;
  s.idx++;
  
  // Round complete?
  if(s.idx>=s.cards.length){
    // Build next round: unknown cards + shuffle
    if(s.unknown.length>0){
      const next=[...s.unknown];
      for(let i=next.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[next[i],next[j]]=[next[j],next[i]];}
      s.cards=next;
      s.idx=0;
      s.round++;
      s.known=[];
      s.unknown=[];
      s.totalRounds++;
    }else{
      // All known! Show final stats
      s.totalRounds++;
      DB.save();
      document.getElementById('vocabView').innerHTML=
        `<div style="text-align:center;padding:30px;">
          <div style="font-size:3em;margin-bottom:10px;">🎉</div>
          <h2>全部掌握！</h2>
          <p style="color:var(--t2);">共${s.totalRounds}轮，所有术语已标记掌握</p>
          <button class="btn btn-p" style="margin-top:14px;" onclick="rVocab()">返回生词本</button>
        </div>`;
      _fcState=null;
      return;
    }
  }
  renderFlashcard();
}

function buildLectureMd(l,courseName){
  let md=`# ${l.title}\n\n**课程**: ${courseName}  \n**日期**: ${fmtDateFull(l.cts)}  \n**时长**: ${l.duration?Math.round(l.duration/60)+'分钟':''}  \n\n`;
  if(l.transcript&&l.transcript.length){
    md+=`## 📝 课堂文稿\n\n`;
    l.transcript.forEach(s=>{
      const tl=(l.translations||[]).find(t=>t.start===s.start&&t.end===s.end);
      md+=`**[${fmtTime(s.start)}]** ${s.text}\n`;
      if(tl&&tl.translation) md+=`> 🇨🇳 ${tl.translation}\n`;
      md+=`\n`;
    });
  }
  if(l.concepts&&l.concepts.length){
    md+=`## 🧠 知识点\n\n`;
    l.concepts.forEach(k=>{
      md+=`### ${k.concept}${k.category?` (${k.category})`:''}\n${k.definition||''}\n\n`;
      if(k.zh_translation) md+=`🇨🇳 ${k.zh_translation}\n\n`;
      if(k.zh_analogy) md+=`💡 ${k.zh_analogy}\n\n`;
    });
  }
  if(l.assignments&&l.assignments.length){
    md+=`## 📋 作业\n\n`;
    l.assignments.forEach(a=>{
      md+=`- **${a.description||'未命名'}**`;
      if(a.zh_description) md+=` — ${a.zh_description}`;
      if(a.due_date||a.dueDate) md+=` ⏰ 截止: ${fmtDateFull(a.due_date||a.dueDate)}`;
      md+=`\n`;
    });
    md+=`\n`;
  }
  if(l.examInfo&&l.examInfo.length){
    md+=`## 📅 考试信息\n\n`;
    l.examInfo.forEach(e=>{
      md+=`- **${e.description||'考试安排'}**`;
      if(e.zh_description) md+=` — ${e.zh_description}`;
      if(e.due_date||e.dueDate) md+=` 📆 ${fmtDateFull(e.due_date||e.dueDate)}`;
      md+=`\n`;
    });
    md+=`\n`;
  }
  return md;
}

function buildCourseMd(c){
  let md=`# ${c.name} (${c.code})\n\n**学期**: ${c.semester||''}  \n**课时数**: ${c.lectures.length}  \n**导出日期**: ${new Date().toLocaleDateString('zh-CN')}  \n\n---\n\n`;
  c.lectures.forEach((l,i)=>{
    md+=buildLectureMd(l,c.name);
    if(i<c.lectures.length-1) md+=`---\n\n`;
  });
  return md;
}

function exportMarkdown(type){
  let md='',filename='';
  if(type==='lecture'&&_cl){
    md=buildLectureMd(_cl,_cc?.name||'');
    filename=(_cl.title||'lecture').replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g,'_').replace(/^_|_$/g,'')+'.md';
  }else if(type==='course'&&_cc){
    md=buildCourseMd(_cc);
    filename=(_cc.name||'course').replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g,'_').replace(/^_|_$/g,'')+'.md';
  }else return;
  downloadBlob(md,'text/markdown;charset=utf-8',filename);
}

async function exportDocx(type){
  if(!window.docx){alert('docx.js 库加载失败，请刷新页面重试');return;}
  const {Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx;
  let doc,filename;
  if(type==='lecture'&&_cl){
    filename=(_cl.title||'lecture').replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g,'_').replace(/^_|_$/g,'')+'.docx';
    doc=buildLectureDocx(_cl,_cc?.name||'');
  }else if(type==='course'&&_cc){
    filename=(_cc.name||'course').replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g,'_').replace(/^_|_$/g,'')+'.docx';
    doc=buildCourseDocx(_cc);
  }else return;
  try{
    const blob=await Packer.toBlob(doc);
    downloadBlob(blob,'application/vnd.openxmlformats-officedocument.wordprocessingml.document',filename);
  }catch(e){alert('DOCX生成失败: '+e.message);}
}

function buildLectureDocx(l,courseName){
  const {Document,Paragraph,TextRun,HeadingLevel}=window.docx;
  const ch=[];
  ch.push(new Paragraph({heading:HeadingLevel.HEADING_1,children:[new TextRun(l.title)]}));
  ch.push(new Paragraph({children:[new TextRun({text:`课程: ${courseName}  |  日期: ${fmtDateFull(l.cts)}  |  时长: ${l.duration?Math.round(l.duration/60)+'分钟':''}`,italics:true,size:20})]}));
  if(l.transcript&&l.transcript.length){
    ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun('课堂文稿')]}));
    l.transcript.forEach(s=>{
      const tl=(l.translations||[]).find(t=>t.start===s.start&&t.end===s.end);
      ch.push(new Paragraph({children:[new TextRun({text:`[${fmtTime(s.start)}] `,bold:true,size:18}),new TextRun({text:s.text,size:20})]}));
      if(tl&&tl.translation) ch.push(new Paragraph({children:[new TextRun({text:`🇨🇳 ${tl.translation}`,italics:true,color:'2E7D32',size:18})]}));
    });
  }
  if(l.concepts&&l.concepts.length){
    ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun('知识点')]}));
    l.concepts.forEach(k=>{
      ch.push(new Paragraph({heading:HeadingLevel.HEADING_3,children:[new TextRun(k.concept)]}));
      if(k.definition) ch.push(new Paragraph({children:[new TextRun({text:k.definition,size:20})]}));
      if(k.zh_translation) ch.push(new Paragraph({children:[new TextRun({text:`🇨🇳 ${k.zh_translation}`,color:'2E7D32',size:18})]}));
      if(k.zh_analogy) ch.push(new Paragraph({children:[new TextRun({text:`💡 ${k.zh_analogy}`,italics:true,size:18})]}));
    });
  }
  if(l.assignments&&l.assignments.length){
    ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun('作业')]}));
    l.assignments.forEach(a=>{
      let txt=a.description||'未命名';
      if(a.zh_description) txt+=` — ${a.zh_description}`;
      if(a.due_date||a.dueDate) txt+=` (截止: ${fmtDateFull(a.due_date||a.dueDate)})`;
      ch.push(new Paragraph({children:[new TextRun({text:`• ${txt}`,size:20})]}));
    });
  }
  if(l.examInfo&&l.examInfo.length){
    ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun('考试信息')]}));
    l.examInfo.forEach(e=>{
      let txt=e.description||'考试安排';
      if(e.zh_description) txt+=` — ${e.zh_description}`;
      if(e.due_date||e.dueDate) txt+=` (${fmtDateFull(e.due_date||e.dueDate)})`;
      ch.push(new Paragraph({children:[new TextRun({text:`• ${txt}`,size:20})]}));
    });
  }
  return new Document({sections:[{children:ch}]});
}

function buildCourseDocx(c){
  const {Document,Paragraph,TextRun,HeadingLevel}=window.docx;
  const ch=[];
  ch.push(new Paragraph({heading:HeadingLevel.HEADING_1,children:[new TextRun(`${c.name} (${c.code})`)]}));
  ch.push(new Paragraph({children:[new TextRun({text:`学期: ${c.semester||''}  |  课时数: ${c.lectures.length}  |  导出日期: ${new Date().toLocaleDateString('zh-CN')}`,italics:true,size:20})]}));
  c.lectures.forEach((l,i)=>{
    if(i>0) ch.push(new Paragraph({children:[]}));
    ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun(`课时${i+1}: ${l.title}`)]}));
    ch.push(new Paragraph({children:[new TextRun({text:`日期: ${fmtDateFull(l.cts)}  |  时长: ${l.duration?Math.round(l.duration/60)+'分钟':''}`,italics:true,size:18})]}));
    if(l.transcript&&l.transcript.length){
      ch.push(new Paragraph({heading:HeadingLevel.HEADING_3,children:[new TextRun('课堂文稿')]}));
      l.transcript.forEach(s=>{
        const tl=(l.translations||[]).find(t=>t.start===s.start&&t.end===s.end);
        ch.push(new Paragraph({children:[new TextRun({text:`[${fmtTime(s.start)}] `,bold:true,size:16}),new TextRun({text:s.text,size:18})]}));
        if(tl&&tl.translation) ch.push(new Paragraph({children:[new TextRun({text:`🇨🇳 ${tl.translation}`,italics:true,color:'2E7D32',size:16})]}));
      });
    }
    if(l.concepts&&l.concepts.length){
      ch.push(new Paragraph({heading:HeadingLevel.HEADING_3,children:[new TextRun('知识点')]}));
      l.concepts.forEach(k=>{
        ch.push(new Paragraph({children:[new TextRun({text:`• ${k.concept}`,bold:true,size:18}),new TextRun({text:`: ${k.definition||''}`,size:18})]}));
        if(k.zh_translation) ch.push(new Paragraph({children:[new TextRun({text:`  🇨🇳 ${k.zh_translation}`,color:'2E7D32',size:16})]}));
      });
    }
  });
  return new Document({sections:[{children:ch}]});
}

function downloadBlob(content,mime,filename){
  const blob=new Blob(['\ufeff'+content],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

let _bilingualMode=false;

function switchRightTab(idx){
  const rp=document.getElementById('rp');
  if(!rp)return;
  const tabs=rp.parentElement.querySelectorAll('.ptabs .pt');
  tabs.forEach((t,i)=>t.classList.toggle('ac',i===idx));

  const notes=document.getElementById('rpNotes');
  if(ai)ai.style.display=idx===0?'':'none';

// ======= NOTES =======
function renderNotesPanel(l){
  const notes=l.notes||[];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">`;
  h+=`<strong style="font-size:.85em;">✏️ 笔记 (${notes.length})</strong>`;
  h+=`<button class="btn btn-sm btn-p" onclick="addNoteAtTimestamp(-1)">➕ 添加</button>`;
  h+=`</div>`;
  if(!notes.length){
    h+=`<div class="note-hint">点击文稿任意段落添加笔记，笔记会绑定时间戳</div>`;
  }else{
    notes.forEach((n,i)=>{
      h+=`<div class="note-item" id="note-${i}">`;
      h+=`<div class="nt"><span>🕐 ${fmtTime(n.start||0)}</span>${n.start>=0?`<button class="btn btn-sm btn-o" style="font-size:.68em;" onclick="jumpTo(${n.start})">▶ 跳转</button>`:''}<button class="btn btn-sm btn-d" style="font-size:.68em;" onclick="deleteNote(${i})">✕</button></div>`;
      if(n.editing){
        h+=`<textarea class="note-input" id="noteInput-${i}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();saveNoteText(${i});}">${escHtml(n.text||'')}</textarea>`;
        h+=`<div style="display:flex;gap:6px;margin-top:6px;"><button class="btn btn-sm btn-p" onclick="saveNoteText(${i})">保存</button><button class="btn btn-sm btn-o" onclick="cancelEditNote(${i})">取消</button></div>`;
      }else{
        h+=`<div class="nc">${escHtml(n.text||'（空笔记，点击编辑）')}</div>`;
        h+=`<div class="na"><button class="btn btn-sm btn-o" style="font-size:.72em;" onclick="editNote(${i})">✏️ 编辑</button></div>`;
      }
      h+=`</div>`;
    });
  }
  return h;
}

function refreshNotesPanel(){
  if(!_cl)return;
  const rpNotes=document.getElementById('rpNotes');
  if(rpNotes)rpNotes.innerHTML=renderNotesPanel(_cl);
}

function addNoteAtTimestamp(start){
  if(!_cl||!_cc)return;
  const notes=_cl.notes||[];
  notes.unshift({start:start>=0?start:0,text:'',ts:Date.now(),editing:true});
  _cl.notes=notes;
  DB.updateLecture(_cc.id,_cl.id,{notes});
  refreshNotesPanel();
  // Focus the textarea
  setTimeout(()=>{
    const ta=document.getElementById('noteInput-0');
    if(ta)ta.focus();
  },100);
}

function editNote(idx){
  if(!_cl||!_cc)return;
  const notes=_cl.notes||[];
  if(notes[idx]){notes[idx].editing=true;_cl.notes=notes;}
  DB.updateLecture(_cc.id,_cl.id,{notes});
  refreshNotesPanel();
}

function cancelEditNote(idx){
  if(!_cl||!_cc)return;
  const notes=_cl.notes||[];
  if(notes[idx]){notes[idx].editing=false;_cl.notes=notes;}
  DB.updateLecture(_cc.id,_cl.id,{notes});
  refreshNotesPanel();
}

function saveNoteText(idx){
  if(!_cl||!_cc)return;
  const notes=_cl.notes||[];
  const ta=document.getElementById('noteInput-'+idx);
  if(notes[idx]&&ta){
    notes[idx].text=ta.value.trim();
    notes[idx].editing=false;
    _cl.notes=notes;
  }
  DB.updateLecture(_cc.id,_cl.id,{notes});
  refreshNotesPanel();
}

function deleteNote(idx){
  if(!_cl||!_cc)return;
  const notes=_cl.notes||[];
  notes.splice(idx,1);
  _cl.notes=notes;
  DB.updateLecture(_cc.id,_cl.id,{notes});
  refreshNotesPanel();
}

function syncBilingualScroll(){
  const en=document.getElementById('bilEn'),zh=document.getElementById('bilZh');
  if(!en||!zh)return;
  en.addEventListener('scroll',()=>{zh.scrollTop=en.scrollTop;});
  zh.addEventListener('scroll',()=>{en.scrollTop=zh.scrollTop;});
  // Re-highlight active line
  setInterval(()=>{
    const t=wavesurfer?wavesurfer.getCurrentTime():(document.querySelector('#fallbackAudio')?.currentTime||0);
    document.querySelectorAll('#bilEn .tl, #bilZh .tl').forEach(line=>{
      const lt=parseFloat(line.dataset.t);
      line.classList.toggle('ac',lt<=t&&(!line.nextElementSibling||parseFloat(line.nextElementSibling.dataset.t)>t||!line.nextElementSibling.dataset.t));
    });
  },200);
}

// ======= QUIZ =======
async function generateQuiz(){
  if(!_cl||!_cc)return;
  const l=_cl;
  if(!l.transcript){alert('没有文稿，无法生成练习题');return;}

  const qs=document.getElementById('quizSection');
  if(qs)qs.innerHTML='<div class="ps cur"><span class="spin"></span> 🧩 AI正在生成练习题...</div>';

  const fullText=l.transcript.map(s=>s.text).join(' ');

  try{
    const r=await fetch(API+'/generate-quiz',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({transcript_text:fullText,concepts:l.concepts||[],num_questions:4})
    });
    if(!r.ok){const et=await r.text();throw new Error('生成失败('+r.status+'): '+et.substring(0,120));}
    const d=await r.json();
    const questions=d.questions||[];

    // Save to lecture
    _quizState={questions,answers:{},submitted:false,score:0};
    l.quizzes=questions;
    DB.updateLecture(_cc.id,_cl.id,{quizzes:questions});

    renderQuizQuestions(questions);
  }catch(e){
    console.error(e);
    if(qs)qs.innerHTML=`<div class="card" style="border-color:var(--danger);"><strong style="color:var(--danger);">❌ ${e.message}</strong><p style="font-size:.78em;margin-top:4px;">后端运行中？需设置 DEEPSEEK_API_KEY</p><button class="btn btn-o btn-sm" style="margin-top:6px;" onclick="generateQuiz()">🔄 重试</button></div>`;
  }
}

function renderQuizQuestions(questions){
  if(!_quizState)_quizState={questions,answers:{},submitted:false,score:0};
  const qs=document.getElementById('quizSection');
  if(!qs)return;

  let h=`<h3 style="margin-bottom:8px;">🧩 随堂练习 (${questions.length}题)</h3>`;
  questions.forEach((q,i)=>{
    h+=`<div class="quiz-card" id="quiz-${i}">`;
    h+=`<div class="quiz-q">${i+1}. ${escHtml(q.question)}</div>`;
    if(q.zh_question)h+=`<div style="color:var(--t2);font-size:.82em;margin-bottom:6px;">🇨🇳 ${escHtml(q.zh_question)}</div>`;

    if(q.type==='mcq'){
      (q.options||[]).forEach(opt=>{
        const letter=opt.charAt(0);
        const sel=_quizState.answers[i]===letter;
        h+=`<div class="quiz-opt${sel?' sel':''}" onclick="selectMcqOption(${i},'${letter}')">${escHtml(opt)}</div>`;
      });
    }else{
      h+=`<textarea class="quiz-sa" id="quizSa-${i}" placeholder="输入你的回答...">${escHtml(_quizState.answers[i]||'')}</textarea>`;
    }
    h+=`</div>`;
  });

  h+=`<div style="display:flex;gap:8px;margin-top:8px;">`;
  h+=`<button class="btn btn-p" onclick="submitQuiz()">✅ 提交答案</button>`;
  h+=`<button class="btn btn-o btn-sm" onclick="resetQuiz()">🔄 重新作答</button>`;
  h+=`</div>`;

  qs.innerHTML=h;
}

function selectMcqOption(qIdx,letter){
  if(!_quizState||_quizState.submitted)return;
  _quizState.answers[qIdx]=letter;
  renderQuizQuestions(_quizState.questions);
}

function submitQuiz(){
  if(!_quizState||_quizState.submitted)return;

  // Collect short answer responses
  _quizState.questions.forEach((q,i)=>{
    if(q.type==='short_answer'){
      const ta=document.getElementById('quizSa-'+i);
      if(ta)_quizState.answers[i]=ta.value.trim();
    }
  });

  // Score
  let correct=0;
  _quizState.questions.forEach((q,i)=>{
    const userAns=(_quizState.answers[i]||'').trim();
    if(q.type==='mcq'){
      if(userAns.toUpperCase()===q.correct_answer.toUpperCase())correct++;
    }
    // Short answer: partial credit if answer provided
  });
  _quizState.submitted=true;
  _quizState.score=correct;

  // Save results
  if(_cl&&_cc){
    const l=_cl;
    const results=_quizState.questions.map((q,i)=>({
      question:q.question,
      user_answer:_quizState.answers[i]||'',
      correct_answer:q.correct_answer,
      type:q.type
    }));
    DB.updateLecture(_cc.id,_cl.id,{quizResults:results});
  }

  renderQuizResults(_cl);
}

function renderQuizResults(l){
  if(!_quizState||!_quizState.submitted){
    // Show saved results or questions
    if(l&&(l.quizzes||[]).length){
      _quizState={questions:l.quizzes,answers:l.quizResults?Object.fromEntries(l.quizResults.map((r,i)=>[i,r.user_answer])):{},submitted:!!l.quizResults,score:0};
      if(l.quizResults){
        l.quizzes.forEach((q,i)=>{
          const r=l.quizResults[i];
          if(r&&q.type==='mcq'&&(r.user_answer||'').toUpperCase()===q.correct_answer.toUpperCase())_quizState.score++;
        });
        _quizState.submitted=true;
      }
    }else{
      return '<button class="btn btn-p" onclick="generateQuiz()">🧩 生成练习题</button>';
    }
  }

  const {questions,answers,score}=_quizState;
  let h=`<h3 style="margin-bottom:8px;">🧩 随堂练习</h3>`;
  h+=`<div class="quiz-score" style="color:${score>=questions.length/2?'var(--accent)':'var(--warn)'};">得分: ${score}/${questions.length}</div>`;

  questions.forEach((q,i)=>{
    const userAns=(answers[i]||'').trim();
    let isCorrect=false;
    if(q.type==='mcq')isCorrect=userAns.toUpperCase()===q.correct_answer.toUpperCase();
    else isCorrect=userAns.length>5; // short answer: any substantial answer gets credit

    h+=`<div class="quiz-card ${isCorrect?'correct':'wrong'}" id="quiz-${i}">`;
    h+=`<div class="quiz-q">${i+1}. ${escHtml(q.question)}</div>`;

    if(q.type==='mcq'){
      (q.options||[]).forEach(opt=>{
        const letter=opt.charAt(0);
        let cls='';
        if(letter===q.correct_answer)cls='correct';
        else if(letter===userAns&&!isCorrect)cls='wrong';
        else if(letter===userAns&&isCorrect)cls='sel correct';
        h+=`<div class="quiz-opt ${cls}">${escHtml(opt)} ${letter===q.correct_answer?'✅':''} ${letter===userAns&&!isCorrect?'← 你的选择':''}</div>`;
      });
    }else{
      h+=`<div style="padding:8px;background:var(--bg);border-radius:6px;font-size:.82em;margin-bottom:6px;"><strong>你的回答:</strong> ${escHtml(userAns||'（未作答）')}</div>`;
      h+=`<div style="padding:8px;background:var(--ad);border-radius:6px;font-size:.82em;"><strong>参考答案:</strong> ${escHtml(q.correct_answer)}</div>`;
    }

    h+=`<div class="quiz-exp">📖 ${escHtml(q.explanation||'')}</div>`;
    if(q.zh_explanation)h+=`<div class="quiz-exp" style="color:var(--accent);">🇨🇳 ${escHtml(q.zh_explanation)}</div>`;
    h+=`</div>`;
  });

  h+=`<div style="display:flex;gap:8px;margin-top:8px;">`;
  h+=`<button class="btn btn-o btn-sm" onclick="resetQuiz()">🔄 重新作答</button>`;
  h+=`</div>`;

  return h;
}

function resetQuiz(){
  if(!_cl||!_cc)return;
  _quizState=null;
  _cl.quizzes=[];
  _cl.quizResults=null;
  DB.updateLecture(_cc.id,_cl.id,{quizzes:[],quizResults:null});
  const qs=document.getElementById('quizSection');

// ======= KNOWLEDGE GRAPH =======
function renderKnowledgeGraph(courseId){
  const c = DB.course(courseId); if(!c) return;
  const svgEl = document.getElementById('kgraph'); if(!svgEl) return;
  
  // Collect all concepts from all lectures
  const allConcepts = [];
  const conceptLectureMap = {};
  c.lectures.forEach(l => {
    (l.concepts||[]).forEach(k => {
      if(!conceptLectureMap[k.concept]) {
        allConcepts.push({...k, lid: l.id, lectureTitle: l.title});
        conceptLectureMap[k.concept] = true;
      }
    });
  });
  
  if(allConcepts.length === 0) {
    document.getElementById('kgraphWrapper').innerHTML = '<p style="color:var(--t3);padding:20px;">暂无知识点</p>';
    return;
  }
  
  // Build graph data
  const nodes = allConcepts.map((k, i) => ({
    id: i,
    label: k.concept,
    zh: k.zh_translation || '',
    category: k.category || '概念',
    size: k.category==='核心'?14:(k.category==='定义'?10:(k.category==='规则'?8:6)),
    lectureTitle: k.lectureTitle,
    lid: k.lid,
    cid: c.id
  }));
  
  // Build edges via keyword overlap
  const edges = [];
  const edgeSet = new Set();
  function tokenize(name) {
    const tokens = new Set();
    name.toLowerCase().split(/[\s\-/()]+/).forEach(t => {
      t = t.replace(/s$/, '');
      if(t.length >= 4) tokens.add(t);
    });
    return tokens;
  }
  const tokenMaps = nodes.map((n, i) => ({i, tokens: tokenize(n.label)}));
  for(let i = 0; i < tokenMaps.length; i++) {
    for(let j = i+1; j < tokenMaps.length; j++) {
      const overlap = [...tokenMaps[i].tokens].filter(t => tokenMaps[j].tokens.has(t));
      if(overlap.length > 0) {
        const key = i+'-'+j;
        if(!edgeSet.has(key)) {
          edgeSet.add(key);
          edges.push({source: i, target: j, weight: overlap.length});
        }
      }
    }
  }
  
  // Color by category
  const catColors = {'核心':'#F59E0B','定义':'#60A5FA','规则':'#C084FC','概念':'#6DB58A'};
  
  // D3 render
  const wrapper = document.getElementById('kgraphWrapper');
  const width = wrapper.clientWidth || 600;
  const height = 450;
  const svg = d3.select('#kgraph');
  svg.selectAll('*').remove();
  svg.attr('viewBox', [0, 0, width, height]);
  
  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => 100 - d.weight*10))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide().radius(30));
  
  const g = svg.append('g');
  
  const link = g.append('g')
    .selectAll('line')
    .data(edges)
    .join('line')
    .attr('stroke', 'var(--brd)')
    .attr('stroke-opacity', 0.4)
    .attr('stroke-width', d => Math.min(d.weight, 3));
  
  const node = g.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => { if(!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if(!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );
  
  node.append('circle')
    .attr('r', d => d.size)
    .attr('fill', d => catColors[d.category] || '#6DB58A')
    .attr('fill-opacity', 0.85)
    .attr('stroke', d => catColors[d.category] || '#6DB58A')
    .attr('stroke-opacity', 0.3)
    .attr('stroke-width', 2);
  
  node.append('text')
    .text(d => d.label.length > 18 ? d.label.slice(0,16)+'..' : d.label)
    .attr('font-size', d => d.size >= 12 ? '8px' : '7px')
    .attr('fill', 'var(--text)')
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.size + 10)
    .style('pointer-events', 'none');
  
  node.append('title')
    .text(d => `${d.label}\n${d.zh}\n${d.category} · ${d.lectureTitle}`);
  
  node.on('click', (event, d) => {
    goPage('lecture', d.cid+'/'+d.lid);
  });
  
  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ======= REVIEW OUTLINE =======
async function generateOutline(courseId){
  const c = DB.course(courseId); if(!c) return;
  const spot = document.getElementById('outlineSpot'); if(!spot) return;
  
  // Collect lectures with concepts
  const readyLectures = c.lectures.filter(l => l.status==='ready' && (l.concepts||[]).length > 0);
  if(readyLectures.length === 0) {
    spot.innerHTML = '<div class="card" style="border-color:var(--warn);text-align:center;cursor:default;">暂无已处理课时，请先上传并处理录音</div>';
    return;
  }
  
  spot.innerHTML = '<div class="ol-load"><span class="spin"></span> 正在生成复习提纲...</div>';
  
  const lectures = readyLectures.map(l => ({
    title: l.title,
    concepts: l.concepts || []
  }));
  
  try {
    const resp = await fetch(API+'/generate-review-outline', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({course_name: c.name, lectures})
    });
    
    if(resp.ok) {
      const data = await resp.json();
      renderOutline(data, c.id);
    } else {
      // Fallback: local outline
      const data = await resp.json().catch(() => ({}));
      if(data.outline) {
        renderOutline(data, c.id);
      } else {
        renderLocalOutline(lectures, c.id, c.name);
      }
    }
  } catch(e) {
    console.warn('Backend unreachable, using local outline:', e);
    renderLocalOutline(lectures, c.id, c.name);
  }
}

function renderOutline(data, courseId){
  const spot = document.getElementById('outlineSpot'); if(!spot) return;
  const outline = data.outline || [];
  const method = data.method || 'local';
  
  if(outline.length === 0) {
    spot.innerHTML = '<div class="card" style="border-color:var(--warn);text-align:center;cursor:default;">未能生成提纲</div>';
    return;
  }
  
  let h = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
    <strong>📋 ${data.total_concepts||0}个知识点 · 复习提纲</strong>
    <span class="ol-method">${method==='llm'?'🤖 AI生成':'⚙️ 本地生成'}</span>
  </div>`;
  
  outline.forEach((sec, si) => {
    h += `<div class="ol-section">
      <div class="ol-hdr open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="arr">▶</span> ${si+1}. ${sec.section} ${sec.zh_section ? '·' : ''} ${sec.zh_section||''}
        ${sec.concepts ? `<span style="font-size:.7em;color:var(--t3);margin-left:4px;">(${sec.concepts.length}个)</span>` : ''}
      </div>
      <div class="ol-body open">`;
    
    // Concepts in this section
    if(sec.concepts && sec.concepts.length > 0) {
      sec.concepts.forEach(cn => {
        const concept = typeof cn === 'string' ? {concept: cn} : cn;
        h += `<div class="ol-item">
          <div class="cn">🧠 ${concept.concept}</div>
          ${concept.definition ? `<div class="df">📖 ${concept.definition.substring(0,120)}</div>` : ''}
          ${concept.zh_translation ? `<div style="font-size:.75em;color:var(--accent);">🇨🇳 ${concept.zh_translation}</div>` : ''}
          ${concept.source_lecture ? `<div class="src">📖 来源: ${concept.source_lecture}${concept.timestamp ? ' · '+fmtTime(concept.timestamp) : ''}</div>` : ''}
        </div>`;
      });
    }
    
    // Subsections
    if(sec.subsections && sec.subsections.length > 0) {
      sec.subsections.forEach(sub => {
        h += `<div class="ol-sub">
          <div class="ol-hdr" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
            <span class="arr">▶</span> ${sub.section} ${sub.zh_section ? '·' : ''} ${sub.zh_section||''}
          </div>
          <div class="ol-body">`;
        if(sub.concepts) {
          sub.concepts.forEach(cn => {
            const concept = typeof cn === 'string' ? {concept: cn} : cn;
            h += `<div class="ol-item">
              <div class="cn">🧠 ${concept.concept}</div>
              ${concept.definition ? `<div class="df">📖 ${concept.definition.substring(0,120)}</div>` : ''}
              ${concept.zh_translation ? `<div style="font-size:.75em;color:var(--accent);">🇨🇳 ${concept.zh_translation}</div>` : ''}
              ${concept.source_lecture ? `<div class="src">📖 来源: ${concept.source_lecture}${concept.timestamp ? ' · '+fmtTime(concept.timestamp) : ''}</div>` : ''}
            </div>`;
          });
        }
        h += `</div></div>`;
      });
    }
    
    h += `</div></div>`;
  });
  
  spot.innerHTML = h;
}

function renderLocalOutline(lectures, courseId, courseName){
  // Pure client-side outline generation
  const allConcepts = [];
  const seen = new Set();
  lectures.forEach(lec => {
    (lec.concepts||[]).forEach(c => {
      const name = (c.concept||'').trim();
      if(name && !seen.has(name.toLowerCase())) {
        seen.add(name.toLowerCase());
        allConcepts.push({...c, source_lecture: lec.title});
      }
    });
  });
  
  // Group by category
  const groups = {};
  allConcepts.forEach(c => {
    const cat = c.category || '概念';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(c);
  });
  
  const order = ['核心','定义','规则','概念'];
  const outline = order.filter(cat => groups[cat]).map(cat => ({
    section: cat + ' Concepts',
    zh_section: {核心:'核心概念', 定义:'基础定义', 规则:'重要规则', 概念:'相关概念'}[cat] || cat,
    concepts: groups[cat].map(c => ({
      concept: c.concept,
      definition: c.definition || '',
      zh_translation: c.zh_translation || '',
      source_lecture: c.source_lecture || '',
      timestamp: c.timestamp || 0
    })),
    subsections: []
  }));
  
  renderOutline({outline, method:'local', total_concepts: allConcepts.length}, courseId);
}
